version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: threeway-matching:latest
    container_name: threeway_matching_app
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./outputs:/app/outputs
      - ./chroma_db_store:/app/chroma_db_store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
