<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — 3-Way Matching</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--bg:#f4f6f9;--primary:#f97316;--danger:#ef4444;--text:#1e293b;--muted:#64748b;--border:#e2e8f0;--radius:10px}
    body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;align-items:center;justify-content:center}
    .login-card{background:#fff;border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.1);padding:40px;width:100%;max-width:380px}
    .login-card .logo{display:flex;align-items:center;gap:12px;margin-bottom:8px;color:var(--primary)}
    .login-card h1{font-size:1.3rem;font-weight:600}
    .login-card p{font-size:.85rem;color:var(--muted);margin-bottom:24px}
    label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
    input{width:100%;padding:11px 14px;border:1px solid var(--border);border-radius:8px;font-size:.95rem;margin-bottom:16px;outline:none}
    input:focus{border-color:var(--primary)}
    button{width:100%;padding:12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:.95rem;font-weight:600;cursor:pointer}
    button:hover{background:var(--primary-hover)}
    button:disabled{opacity:.6;cursor:wait}
    .error{background:#fef2f2;border-left:4px solid var(--danger);color:#991b1b;border-radius:6px;padding:10px 14px;font-size:.85rem;margin-bottom:16px;display:none}
  </style>
</head>
<body>

<div class="login-card">
  <div class="logo">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 13l3-3 3 2 5-5"/></svg>
    <h1>3-Way Matching</h1>
  </div>
  <p>Sign in to continue</p>

  <div class="error" id="error"></div>

  <form onsubmit="return doLogin(event)">
    <label for="username">Username</label>
    <input type="text" id="username" autocomplete="username" required autofocus>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit" id="btnLogin">Sign in</button>
  </form>
</div>

<script>
async function doLogin(event) {
  event.preventDefault();
  const error = document.getElementById('error');
  const button = document.getElementById('btnLogin');
  error.style.display = 'none';
  button.disabled = true;

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value,
      }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.detail || `Login failed (${res.status})`);
    }

    const user = await res.json();
    location.href = user.role === 'ADMIN'
      ? '/admin-dashboard.html'
      : '/audit-dashboard.html';
  } catch (e) {
    error.textContent = e.message;
    error.style.display = 'block';
    button.disabled = false;
  }

  return false;
}
</script>
</body>
</html>
